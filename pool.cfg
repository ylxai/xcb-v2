# Ganti wallet dengan alamat Anda. Dibiarkan kosong agar miner berhenti dengan
# pesan jelas daripada menambang ke alamat contoh. Jangan simpan kredensial
# rahasia (password/token) di sini.
wallet=
# worker=auto -> nama hostname mesin (devbox/VPS/laptop) dipakai sebagai nama
# worker di pool. Satu pool.cfg bisa dipakai di banyak mesin tanpa diubah, dan
# tiap mesin tetap terlihat terpisah di dashboard pool. Ganti dengan nama tetap
# bila ingin label sendiri.
worker=auto
server[1]=sg.catchthatrabbit.com
port[1]=8008
server[2]=hk.catchthatrabbit.com
port[2]=8008
server[3]=de.catchthatrabbit.com
port[3]=8008
