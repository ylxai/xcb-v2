name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repo.
permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint semua shell script yang dilacak git
        # -S style = severity terendah (menangkap info/style juga).
        # -0/-r aman untuk nama file berspasi dan repo tanpa *.sh.
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck -S style

  build-test:
    name: Build + selftest (glibc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (termasuk submodule RandomY + FTXUI)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Verify flag build (LTO + baseline arch aktif)
        run: |
          flags=$(grep -h CXX_FLAGS build/CMakeFiles/xcb.dir/flags.make)
          echo "$flags"
          if ! echo "$flags" | grep -q -- '-flto'; then
            echo "::error::LTO tidak aktif di Release glibc"; exit 1
          fi
          if ! echo "$flags" | grep -q -- '-march=x86-64-v3'; then
            echo "::error::baseline -march hilang"; exit 1
          fi

      - name: Selftest (verifikasi SHA3-512)
        run: ./build/xcb --selftest

      - name: CTest (wiring test CMake)
        run: cd build && ctest --output-on-failure

      - name: Selftest dari direktori tanpa pool.cfg
        # --selftest tidak bicara ke pool. Kalau step ini gagal, gate selftest
        # di Dockerfile dan probe k8s ikut rusak begitu cwd berubah.
        run: cd "$(mktemp -d)" && "$GITHUB_WORKSPACE/build/xcb" --selftest

      - name: Benchmark smoke test
        # Runner tidak punya hugepages. Auto-detect harus mematikan LARGE_PAGES
        # sebelum alokasi, bukan gagal bikin VM lalu exit 0 tanpa menghitung
        # satu hash pun.
        run: |
          set -o pipefail
          timeout 120 ./build/xcb --benchmark 2000 2>&1 | tee bench.log
          if grep -q 'No workers created' bench.log; then
            echo "::error::miner gagal membuat VM di runner"; exit 1
          fi
          if ! grep -q 'auto LARGE_PAGES=0' bench.log; then
            echo "::error::auto-detect tidak mematikan LARGE_PAGES di runner tanpa hugepages"; exit 1
          fi
          if grep -q 'retrying without them' bench.log; then
            echo "::error::auto-detect terlambat — masih mengandalkan fallback alokasi"; exit 1
          fi
          hashes=$(grep -oE 'Total [0-9]+ hashes' bench.log | grep -oE '[0-9]+' | tail -1)
          echo "hashed=${hashes:-0}"
          if [ "${hashes:-0}" -lt 2000 ]; then
            echo "::error::benchmark hanya ${hashes:-0} hash"; exit 1
          fi

      - name: Auto-detect memilih light saat RAM dibatasi
        # Runner punya ~16GB jadi auto memilih full. Di bawah cgroup 512MB
        # pilihannya harus berubah ke light — tanpa env var apa pun.
        run: |
          set -o pipefail
          docker run --rm --network none --memory 512m \
            -v "$PWD/build:/b:ro" -w /b ubuntu:24.04 \
            ./xcb --benchmark 300 2>&1 | tee cg.log
          if ! grep -q 'auto FULL_MEM=0' cg.log; then
            echo "::error::auto-detect tidak membaca cgroup limit (harus pilih light di 512MB)"; exit 1
          fi
          grep -q 'Light mode' cg.log || { echo "::error::light mode tidak aktif"; exit 1; }

  conn:
    name: Build + selftest (CONN / RandomX V2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (termasuk submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev

      - name: Configure + build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"

      - name: Version menunjuk backend CONN
        run: |
          ./build/xcb --version | tee ver.log
          grep -q 'ConnectCoin CONN' ver.log || {
            echo "::error::--version tidak menyebut backend CONN"; exit 1; }
          grep -qE 'xcb [0-9]+\.[0-9]+\.[0-9]+ \(ConnectCoin CONN - RandomX V2, [0-9a-f]+\)' ver.log || {
            echo "::error::format versi/commit salah"; exit 1; }

      - name: Selftest (termasuk vektor RandomX V2)
        run: |
          set -o pipefail
          ./build/xcb --selftest 2>&1 | tee st.log
          grep -q 'randomx-v2 : OK' st.log || {
            echo "::error::selftest RandomX V2 tidak jalan"; exit 1; }
          grep -q 'RESULT: PASS' st.log

      - name: Binary menemukan librandomx_v2.so
        run: |
          ldd build/xcb | tee ldd.log
          grep -q 'librandomx_v2.so =>' ldd.log || {
            echo "::error::librandomx_v2.so tidak ter-resolve"; exit 1; }
          if grep -q 'not found' ldd.log; then
            echo "::error::ada shared library yang hilang"; exit 1
          fi
          readelf -d build/xcb | grep -q 'RPATH\|RUNPATH' || {
            echo "::error::RPATH $ORIGIN hilang"; exit 1; }

      - name: Install menaruh binary + library berdampingan
        run: |
          cmake --install build --prefix "$PWD/stage"
          test -x stage/bin/xcb
          test -f stage/bin/librandomx_v2.so
          ( cd /tmp && "$GITHUB_WORKSPACE/stage/bin/xcb" --version )

      - name: Backend CONN terdaftar di --help
        run: ./build/xcb --help | grep -q -- '--conn-pool'

  build-2204:
    name: Build + artefak deploy (Ubuntu 22.04 / glibc 2.35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (termasuk submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build + selftest di ubuntu:22.04
        run: |
          docker run --rm -v "$PWD":/src -w /src ubuntu:22.04 bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential cmake git libssl-dev ca-certificates >/dev/null
            git config --global --add safe.directory /src
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --parallel "$(nproc)"
            ./build/xcb --version | tee VERSION
            if grep -q unknown VERSION; then echo "ERROR: commit tidak terbaca di --version"; exit 1; fi
            ./build/xcb --selftest
            ldd build/xcb | grep "librandomx_v2.so =>"
          '

      - name: Upload artefak deploy
        uses: actions/upload-artifact@v4
        with:
          name: xcb-2204
          path: |
            build/xcb
            build/librandomx_v2.so
            VERSION
          if-no-files-found: error
          retention-days: 14

  musl:
    name: Build + selftest (Alpine/musl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (termasuk submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Build di container Alpine, bukan container job: actions/checkout butuh
      # node glibc, jadi checkout dilakukan di runner lalu source di-copy masuk.
      - name: Build + selftest di Alpine/musl
        run: |
          docker run --rm -i -v "$PWD":/src:ro alpine:3.20 sh -s <<'EOF'
          set -e
          apk add --no-cache build-base cmake git openssl-dev linux-headers >/dev/null
          cp -r /src /work && cd /work && rm -rf build
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          flags=$(grep -h CXX_FLAGS build/CMakeFiles/xcb.dir/flags.make)
          echo "$flags"
          # musl + LTO gagal saat link (fortify/stdio.h, vsnprintf always_inline).
          # Deteksi musl ada di CMakeLists; step ini yang menjaganya tidak mati diam-diam.
          if echo "$flags" | grep -q -- '-flto'; then
            echo "ERROR: LTO masih aktif di musl"; exit 1
          fi
          cmake --build build --parallel "$(nproc)"
          ./build/xcb --selftest
          file build/xcb
          EOF

  docker:
    name: Docker image + selftest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (termasuk submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build image (selftest jalan di builder stage)
        run: docker build -t xcb:ci .

      - name: Selftest di runtime image
        # Binary ada di WORKDIR /miner, bukan di cwd pemanggil.
        run: docker run --rm --entrypoint sh -w /tmp xcb:ci -c 'cd /miner && ./xcb --selftest'

      - name: Benchmark di container (tanpa hugepages, tanpa network)
        run: |
          set -o pipefail
          docker run --rm --network none -e THREADS=2 xcb:ci --benchmark 1000 2>&1 | tee dbench.log
          if grep -q 'No workers created' dbench.log; then
            echo "::error::VM gagal dibuat di container"; exit 1
          fi
          # Image tidak lagi menyetel FULL_MEM/LARGE_PAGES: auto-detect yang memutuskan.
          grep -q 'auto FULL_MEM=' dbench.log || { echo "::error::auto-detect FULL_MEM tidak jalan di image"; exit 1; }
          grep -q 'auto LARGE_PAGES=0' dbench.log || { echo "::error::auto-detect LARGE_PAGES tidak jalan di image"; exit 1; }
